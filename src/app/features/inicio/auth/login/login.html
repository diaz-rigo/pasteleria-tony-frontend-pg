<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-gray-900">Pastelería Tony</h1>
      <p class="text-sm text-gray-500 mt-1">Acceso al panel administrativo</p>
    </div>
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" formControlName="strUsuEmail"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]" />
        @if (form.controls.strUsuEmail.touched && form.controls.strUsuEmail.invalid) {
          <p class="text-xs text-red-600 mt-1">Email inválido</p>
        }
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
        <input type="password" formControlName="strUsuPassword"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)]" />
      </div>
      <button type="submit" [disabled]="cargando() || form.invalid"
              class="w-full py-2.5 rounded-lg bg-[var(--color-primary)] text-white font-semibold hover:bg-[var(--color-primary-dark)] disabled:opacity-50 transition">
        @if (cargando()) { Ingresando... } @else { Ingresar }
      </button>
    </form>
  </div>
</div>
