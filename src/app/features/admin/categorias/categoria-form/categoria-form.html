<form [formGroup]="form" (ngSubmit)="submit()" class="grid grid-cols-1 gap-4 p-4 sm:grid-cols-2 sm:p-5">
  <label class="sm:col-span-2"><span class="admin-label">Nombre de categoría</span><input formControlName="nombre" class="admin-input" placeholder="Ej. Pasteles"></label>
  <label class="sm:col-span-2"><span class="admin-label">Categoría principal</span><select formControlName="idPadre" class="admin-input"><option [ngValue]="null">Categoría principal (sin categoría superior)</option>@for(c of categoriasPadre();track c.id){<option [ngValue]="c.id">{{c.nombre}}</option>}</select><small class="text-secondary">Elige una categoría para crear una subcategoría.</small></label>
  <label class="sm:col-span-2"><span class="admin-label">Descripción</span><textarea formControlName="descripcion" rows="3" class="admin-input" placeholder="Describe brevemente esta categoría"></textarea></label>
  <label class="flex min-h-11 items-center gap-2 text-sm text-primary"><input type="checkbox" formControlName="activa" class="h-4 w-4 accent-[var(--accent)]"><span>Visible en el catálogo</span></label>
  <div class="flex flex-col-reverse gap-2 sm:col-span-2 sm:flex-row sm:justify-end"><button type="button" (click)="cancelar.emit()" class="admin-btn admin-btn-secondary"><svg lucideX [size]="16"></svg>Cancelar</button><button type="submit" [disabled]="form.invalid" class="admin-btn admin-btn-primary disabled:cursor-not-allowed disabled:opacity-50"><svg lucideSave [size]="16"></svg>Guardar categoría</button></div>
</form>
