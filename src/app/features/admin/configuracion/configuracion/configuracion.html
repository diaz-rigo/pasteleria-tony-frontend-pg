<section class="admin-page">
	<header class="admin-page-heading">
		<div>
			<h1 class="admin-page-title">Configuración del negocio</h1>
			<p class="admin-page-description">Personaliza la identidad y la información pública de la pastelería.</p>
		</div>
	</header>
	<form [formGroup]="form" (ngSubmit)="guardar()" class="admin-card grid grid-cols-1 gap-4 p-4 sm:grid-cols-2 sm:gap-5 sm:p-6">
		<h2 class="admin-card-title sm:col-span-2">Identidad y apariencia</h2>
		<label><span class="admin-label">Nombre del negocio</span><input formControlName="strCfgNombreNegocio" class="admin-input"></label>
		<label><span class="admin-label">Color principal</span>
			<div class="flex min-h-11 items-center gap-3"><input type="color" formControlName="strCfgColorPrimario" class="h-11 w-14 rounded-lg border p-1" style="border-color:var(--line)"><span class="text-xs text-secondary">Se aplica a botones y elementos activos</span></div>
		</label>
		<!-- <div class="sm:col-span-2"><span class="admin-label">Logotipo</span><app-selector-imagen [urlActual]="form.controls.strCfgUrlLogo.value || null" nombre="el logotipo" [deshabilitado]="guardando" (archivoCambio)="cambiarLogo($event)" /></div> -->
		<label class="sm:col-span-2"><span class="admin-label">Texto del pie de página</span><input formControlName="strCfgTextoPie" class="admin-input"></label>
		<h2 class="admin-card-title sm:col-span-2 sm:mt-2">Página principal</h2>
		<label><span class="admin-label">Título principal</span><input formControlName="strCfgTituloHero" class="admin-input"></label>
		<label><span class="admin-label">Subtítulo principal</span><input formControlName="strCfgSubtituloHero" class="admin-input"></label>
		<div><span class="admin-label">Imagen principal</span><app-selector-imagen [urlActual]="form.controls.strCfgUrlImagenHero.value || null" nombre="la imagen principal" [deshabilitado]="guardando" (archivoCambio)="cambiarImagenHero($event)" /></div>
		<label><span class="admin-label">Texto del botón principal</span><input formControlName="strCfgTextoBotonHero" class="admin-input"></label>
		<label class="sm:col-span-2"><span class="admin-label">Destino del botón (ruta interna o URL)</span><input formControlName="strCfgUrlBotonHero" class="admin-input" placeholder="/catalogo"></label>
		<div class="grid gap-2 sm:col-span-2 sm:grid-cols-2"><label class="flex min-h-11 items-center gap-2 text-sm text-primary"><input type="checkbox" formControlName="blnCfgMostrarTituloHero" class="h-4 w-4 accent-[var(--accent)]">Mostrar título</label><label class="flex min-h-11 items-center gap-2 text-sm text-primary"><input type="checkbox" formControlName="blnCfgMostrarSubtituloHero" class="h-4 w-4 accent-[var(--accent)]">Mostrar subtítulo</label><label class="flex min-h-11 items-center gap-2 text-sm text-primary"><input type="checkbox" formControlName="blnCfgMostrarImagenHero" class="h-4 w-4 accent-[var(--accent)]">Mostrar imagen</label><label class="flex min-h-11 items-center gap-2 text-sm text-primary"><input type="checkbox" formControlName="blnCfgMostrarBotonHero" class="h-4 w-4 accent-[var(--accent)]">Mostrar botón</label></div>
		<h2 class="admin-card-title sm:col-span-2 sm:mt-2">Dirección del negocio</h2>
		<label class="sm:col-span-2"><span class="admin-label">Calle y número</span><input formControlName="strCfgCalle" class="admin-input"></label>
		<label><span class="admin-label">Ciudad</span><input formControlName="strCfgCiudad" class="admin-input"></label>
		<label><span class="admin-label">Estado</span><input formControlName="strCfgEstado" class="admin-input"></label>
		<label><span class="admin-label">Código postal</span><input formControlName="strCfgCodigoPostal" class="admin-input"></label>
		<label><span class="admin-label">País</span><input formControlName="strCfgPais" class="admin-input"></label>
		<label class="sm:col-span-2"><span class="admin-label">Enlace de mapa</span><input formControlName="strCfgUrlMapa" type="url" class="admin-input" placeholder="https://maps.google.com/..."></label>
		<h2 class="admin-card-title sm:col-span-2 sm:mt-2">Buscadores</h2>
		<label class="sm:col-span-2"><span class="admin-label">Título meta</span><input formControlName="strCfgTituloMeta" class="admin-input"></label>
		<label class="sm:col-span-2"><span class="admin-label">Descripción meta</span><textarea formControlName="strCfgDescripcionMeta" rows="3" class="admin-input"></textarea></label>
		<div class="flex flex-col-reverse gap-2 border-t pt-4 sm:col-span-2 sm:flex-row sm:justify-end" style="border-color:var(--line)"><button type="button" (click)="form.reset(store.config() || {});archivoLogo=null;archivoHero=null" [disabled]="guardando" class="admin-btn admin-btn-secondary"><svg lucideUndo2 [size]="16"></svg>Descartar cambios</button><button type="submit" [disabled]="guardando" class="admin-btn admin-btn-primary"><svg lucideSave [size]="16"></svg>{{guardando?'Subiendo imágenes…':'Guardar configuración'}}</button></div>
	</form>
</section>
